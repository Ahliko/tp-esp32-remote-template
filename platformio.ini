[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

board_build.arduino.memory_type = qio_qspi
board_build.f_cpu = 240000000L    ; Force le CPU à 240 MHz
board_build.f_flash = 80000000L   ; Force le bus Flash/PSRAM à 80 MHz (au lieu de 40 MHz)

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1

test_framework = custom